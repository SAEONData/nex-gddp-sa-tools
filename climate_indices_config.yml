# ─────────────────────────────────────────────────────────────
# Climate Indices Configuration YAML
# ─────────────────────────────────────────────────────────────

#experiments:
#  select: ["historical"]

experiments:
  select: ["historical", "ssp126", "ssp245", "ssp370", "ssp585"]

time_slices:
  "Baseline (1995–2014)": ["1995-01-01", "2014-12-31"]
  "Near-term (2021–2040)": ["2021-01-01", "2040-12-31"]
  "Mid-term (2041–2060)": ["2041-01-01", "2060-12-31"]
  "Far-term (2081–2100)": ["2081-01-01", "2100-12-31"]

run_indices:
#- cdd
#- cwd
#- r10mm
#- r20mm
#- prcptot
# - r95ptot
# - r99ptot
# - r95p
# - r99p
#- spi
#- sdii
# - rx1day
# - rx5day
  
# - fd
# - tnlt2
# - txx
# - tnn
#- wsdi
#- csdi
#- txgt50p
#- txge30
- txd_tnd
#- tnx
#- txn
#- tx10p
#- tx90p
#- tn10p
#- tn90p
  
region:
  # Spatial bounding box for subsetting climate model data
  lat_min: -35.0
  lat_max: -20.0
  lon_min: 16.0
  lon_max: 33.0

cdd:
  # Consecutive Dry Days (CDD)
  threshold_mm: 1.0         # PR < threshold => "dry"
  aggregation: annual       # 'annual' | 'monthly' | 'seasonal'
  aggregation_code: "YS"    # pandas offset alias used by xclim (e.g., 'MS', 'QS-DEC', 'YS')
  output_units: days

cwd:
  threshold_mm: 1.0
  aggregation: annual
  aggregation_code: "YS"
  output_units: days

r10mm:
  threshold_mm: 10.0
  aggregation: annual
  aggregation_code: "YS"

r20mm:
  threshold_mm: 20.0
  aggregation: annual
  aggregation_code: "YS"

prcptot:
  threshold_mm: 1.0
  aggregation: annual
  
r95ptot:
  wetday_threshold_mm: 1.0
  baseline_slice: "Baseline (1995–2014)"
  percentile: 95
  
r99ptot:
  wetday_threshold_mm: 1.0
  baseline_slice: "Baseline (1995–2014)"
  percentile: 99  
  
r95p:
  wetday_threshold_mm: 1.0
  baseline_slice: "Baseline (1995–2014)"
  aggregation: annual        # or 'seasonal' / 'monthly' if you prefer
  percentile: 95

r99p:
  wetday_threshold_mm: 1.0
  baseline_slice: "Baseline (1995–2014)"
  aggregation: annual
  percentile: 99
  
spi:
  scales: [3, 6, 12]          # already there → runs all three windows
  default_scale: 6            # ALSO write: spi_ensemble_mean_historical_baseline_1995-2014.nc (as SPI-6)
# target_calendar: "noleap"   # recommended to match the script’s normalization
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  
sdii:
  threshold_mm: 1.0
  aggregation: annual     # or 'seasonal' / 'monthly'
  
rx1day:
  aggregation: annual    # options: annual | seasonal | monthly  (maps to YS | QS-DEC | MS)
  
rx5day:
  aggregation: annual   # options: annual | seasonal | monthly  (maps to YS | QS-DEC | MS)
  
fd:
  threshold_celsius: 0.0
  variable: tasmin
  aggregation: annual    # or 'seasonal' | 'monthly'
  
tnlt2:
  threshold_celsius: 2.0
  variable: tasmin
  aggregation: annual    # or 'seasonal' | 'monthly'
  
txx:
  variable: tasmax
  aggregation: annual    # or 'seasonal' | 'monthly'
  
tnn:
  variable: tasmin
  aggregation: annual
  
wsdi:
  min_spell_length: 6
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  variable: tasmax
  aggregation: annual   # (logic counts per-year spell days, then averages within slice)
  
csdi:
  variable: tasmin
  min_spell_length: 6
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  
txgt50p:
  variable: tasmax
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  
txge30:
  # Days per year with tasmax ≥ threshold (default 30 °C),
  # averaged within each time slice, then ensemble-mean.
  variable: tasmax
  threshold_c: 30.0       # change to 35.0 for TXge35-style runs
  # aggregation is implicit (counts per year, average within slice)
  
txd_tnd:
  tx_variable: tasmax
  tn_variable: tasmin
  percentile: 95
  min_spell_length: 3
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  
tnx:
  variable: tasmin
  # No threshold: we take the annual max of daily Tmin (hottest night)
  
txn:
  variable: tasmax
  
tx10p:
  variable: tasmax
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  
tx90p:
  variable: tasmax
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  
tn10p:
  variable: tasmin
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"
  
tn90p:
  variable: tasmin
  reference_start: "1995-01-01"
  reference_end:   "2014-12-31"