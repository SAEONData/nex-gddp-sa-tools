# ─────────────────────────────────────────────────────────────
# Climate Indices Configuration YAML
# Use this file to configure spatial bounds, index parameters,
# and general settings for running climate index calculations.
# ─────────────────────────────────────────────────────────────
#experiments:
# select: ["historical"]
  
experiments:
  select: ["historical", "ssp126", "ssp245", "ssp370", "ssp585"]
  
time_slices:
  "Baseline (1995–2014)": ["1995-01-01", "2014-12-31"]
  "Near-term (2021–2040)": ["2021-01-01", "2040-12-31"]
  "Mid-term (2041–2060)": ["2041-01-01", "2060-12-31"]
  "Far-term (2081–2100)": ["2081-01-01", "2100-12-31"]

run_indices:
#- cdd
#- cwd
#- r10mm
  - r20mm
#- prcptot
#- r95ptot
#- r99ptot
#- r95p
#- spi

region:
  # Spatial bounding box for subsetting climate model data
  lat_min: -35.0       # Southernmost latitude
  lat_max: -20.0       # Northernmost latitude
  lon_min: 16.0        # Westernmost longitude
  lon_max: 33.0        # Easternmost longitude

cdd:
  # Consecutive Dry Days index (CDD)
  threshold_mm: 1.0          # Threshold in mm/day (days with PR < this are considered "dry")
  aggregation: annual        # Options: 'annual', 'monthly', 'seasonal'
  aggregation_code: "YS"
  output_units: days         # Typically 'days' (i.e., max length of dry spell)
  
cwd:
  threshold_mm: 1.0
  aggregation: annual
  aggregation_code: "YS"
  output_units: days
  
r10mm:
  threshold_mm: 10.0
  aggregation: annual
  aggregation_code: "YS"
  
r20mm:
  threshold_mm: 20.0
  aggregation: annual
  
prcptot:
  threshold_mm: 1.0
  aggregation: annual
  
r95ptot:
  threshold_mm: 1.0
  percentile: 95
  aggregation: annual
  reference_start: "1981-01-01"
  reference_end: "2010-12-31"
  
r99ptot:
  threshold_mm: 1.0
  percentile: 99
  aggregation: annual
  reference_start: "1981-01-01"
  reference_end: "2010-12-31"
  
r95p:
  threshold_mm: 1.0
  percentile: 95
  aggregation: annual
  reference_start: "1981-01-01"
  reference_end: "2010-12-31"
  
spi:
  scales: [3, 6, 12]
  distribution: gamma
  method: ML
  reference_start: "1981-01-01"
  reference_end: "2010-12-31"