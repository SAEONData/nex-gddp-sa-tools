- name: txd_tnd
  variable: txd_tnd_events
  data_dir: "data/outputs/txd_tnd"
  output: "txdtnd_timeslices.png"
  cmap: YlOrRd
  legend_label: "Heatwave events per year (TX & TN > 95th, ≥3 days)"
  anomaly: false

- name: txd_tnd
  variable: txd_tnd_events_anom
  data_dir: "data/outputs/txd_tnd"
  output: "txd_tnd_anomaly_timeslices.png"
  cmap: RdBu_r
  legend_label: "txd_tnd (Δ events/year vs 1995–2014)"
  anomaly: true
