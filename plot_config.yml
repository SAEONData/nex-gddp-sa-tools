- name: rx5day
  variable: rx5day_anomaly
  data_dir: "data/outputs/rx5day"
  cmap: RdBu
  legend_label: "Rx5day Anomaly (Δ mm vs 1995–2014)"
  anomaly: true
  # vmin: -100   # optional fixed scale suggestion
  # vmax:  100
  

- name: rx5day
  variable: rx5day
  data_dir: "data/outputs/rx5day"
  cmap: YlGnBu
  legend_label: "Rx5day (Wettest 5-day Total, mm)"
  anomaly: false
  # vmin: 50     # tune after first pass
