# plot_config.yml (with vmin/vmax support)
paths:
  shapefile: "climate_regions/cleaned_clim_reg_2025_06_30.shp"
  shapefile2: "MDB_District_Municipal_Boundary_2018/MDB_District_Municipal_Boundary_2018.shp"
  towns_csv: "cities/cities.csv"
  output_dir: "data/outputs/plots"
  

scenarios:
  - historical
  - ssp126
  - ssp245
  - ssp370
  - ssp585

indices:
  - name: cdd
    variable: max_cdd
    data_dir: "data/outputs/cdd"
    output: "cdd_bioregion_timeslices.png"
    cmap: YlOrBr
    legend_label: "Max Consecutive Dry Days (days)"
    spatial_agg: max          # options: mean, max, min, median
    vmin: 0                   # ✅ Set global colorbar minimum (optional)
    vmax: 120                 # ✅ Set global colorbar maximum (optional)

  - name: cwd
    variable: max_cwd
    data_dir: "data/outputs/cwd"
    output: "cwd_bioregion_timeslices.png"
    cmap: Blues
    legend_label: "Max Consecutive Wet Days (days)"
    spatial_agg: max
    vmin: 0
    vmax: 40

