# plot_config.yml (with vmin/vmax and anomaly toggle)
paths:
  shapefile: "climate_regions/cleaned_clim_reg_2025_06_30.shp"
  shapefile2: "MDB_District_Municipal_Boundary_2018/MDB_District_Municipal_Boundary_2018.shp"
  towns_csv: "cities/cities.csv"
  output_dir: "data/outputs/plots"

scenarios:
  - historical
# - ssp126
  - ssp245
  - ssp370
  - ssp585

